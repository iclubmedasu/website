name: CI — Lint, Type Check & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          attempt=1
          max_attempts=4
          while [ "$attempt" -le "$max_attempts" ]; do
            set +e
            output=$(pnpm audit --audit-level moderate 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            # Real findings: fail immediately (do not backoff-retry advisories)
            if printf '%s' "$output" | grep -qi 'vulnerabilities found'; then
              echo "pnpm audit reported vulnerabilities; failing without retry"
              exit 1
            fi

            # Retry only on npm registry / network failures
            if ! printf '%s' "$output" | grep -Eqi 'timeout|ETIMEDOUT|ECONNRESET|500|FetchError|registry'; then
              echo "pnpm audit failed with a non-registry error; failing without retry"
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "pnpm audit failed after ${max_attempts} registry attempts"
              exit 1
            fi
            case "$attempt" in
              1) delay=20 ;;
              2) delay=40 ;;
              3) delay=60 ;;
            esac
            echo "pnpm audit registry error (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (backend)
        run: pnpm --filter backend prisma:generate

      - name: Build shared package
        run: pnpm --filter @iclub/shared build

      - name: Type check backend
        run: pnpm --filter backend typecheck

      - name: Type check members portal
        run: pnpm --filter members-portal typecheck

      - name: Type check public website
        run: pnpm --filter public-website typecheck

      - name: Lint
        run: pnpm lint

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (backend)
        run: pnpm --filter backend prisma:generate

      - name: Build shared package
        run: pnpm --filter @iclub/shared build

      - name: Run unit tests
        run: pnpm test:run

      - name: Generate coverage report
        run: pnpm test:coverage:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (backend)
        run: pnpm --filter backend prisma:generate

      - name: Build shared package
        run: pnpm --filter @iclub/shared build

      - name: Build members portal
        run: pnpm --filter members-portal build

      - name: Build public website
        run: pnpm --filter public-website build

      - name: Build backend
        run: pnpm --filter backend build

  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (backend)
        run: pnpm --filter backend prisma:generate

      - name: Build shared package
        run: pnpm --filter @iclub/shared build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (Chromium)
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
